name: Universal CI

on:
  push:
    branches:
      - main
      - feature/*
      - bugfix/*
      - hotfix/*
      - chore/*
      - refactor/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      language: ${{ steps.detect.outputs.language }}
      languages: ${{ steps.detect.outputs.languages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect Project Type
        id: detect
        run: |
          echo "=== Launching Project Type Auto-Detection ==="
          bash scripts/detect.sh

  build:
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: ${{ fromJson(needs.detect.outputs.languages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Artifactory
        run: |
          echo "=== Authenticating with JFrog Artifactory Registry (trial2zs76n.jfrog.io) ==="
          echo "${{ secrets.JFROG_PASSWORD }}" | docker login trial2zs76n.jfrog.io \
            -u "${{ secrets.JFROG_USERNAME }}" \
            --password-stdin
          echo "[SUCCESS] Successfully authenticated."

      # JAVA BUILD STEPS
      - name: Create Authenticated Maven settings.xml
        if: matrix.language == 'java'
        run: |
          mkdir -p .github/maven
          cat << 'EOF' > .github/maven/settings.xml
          <settings>
            <servers>
              <server>
                <id>artifactory</id>
                <username>${env.JFROG_USERNAME}</username>
                <password>${env.JFROG_PASSWORD}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>artifactory-profile</id>
                <repositories>
                  <repository>
                    <id>artifactory</id>
                    <url>https://trial2zs76n.jfrog.io/artifactory/maven-central</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                  <repository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>artifactory</id>
                    <url>https://trial2zs76n.jfrog.io/artifactory/maven-central</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </pluginRepository>
                  <pluginRepository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>artifactory-profile</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Run Build in Java Container
        if: matrix.language == 'java'
        run: |
          echo "=== Executing Java Maven Package Build inside Docker ==="
          echo "[INFO] Using Eclipse Temurin 21 Builder Image."
          docker run --rm \
            --entrypoint "" \
            -e JFROG_USERNAME="${{ secrets.JFROG_USERNAME }}" \
            -e JFROG_PASSWORD="${{ secrets.JFROG_PASSWORD }}" \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/.github/maven/settings.xml:/root/.m2/settings.xml \
            -w /workspace \
            trial2zs76n.jfrog.io/docker-local/java-builder:1.0 \
            mvn clean package -U -DskipTests
          echo "[SUCCESS] Maven build successful."

      - name: Upload Java Artifact
        if: matrix.language == 'java'
        uses: actions/upload-artifact@v4
        with:
          name: java-artifact
          path: target/*.jar
          retention-days: 1

      # PYTHON BUILD STEPS
      - name: Create Authenticated pip.conf
        if: matrix.language == 'python'
        run: |
          echo "=== Generating Authenticated pip.conf for PyPI ==="
          mkdir -p .github/pip
          cat << EOF > .github/pip/pip.conf
          [global]
          index-url=https://${{ secrets.JFROG_USERNAME }}:${{ secrets.JFROG_PASSWORD }}@trial2zs76n.jfrog.io/artifactory/api/pypi/pypi/simple
          EOF
          echo "[SUCCESS] pip.conf written to .github/pip/pip.conf"

      - name: Run Build in Python Container
        if: matrix.language == 'python'
        run: |
          echo "=== Executing Python Package Build inside Docker ==="
          echo "[INFO] Using Python 3.12 Builder Image."
          docker run --rm \
            --entrypoint "" \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/.github/pip/pip.conf:/etc/pip.conf \
            -w /workspace \
            trial2zs76n.jfrog.io/docker-local/python-builder:1.0 \
            bash -c "if [ -f requirements.txt ]; then pip install --root-user-action=ignore -r requirements.txt; fi && python -m build"
          echo "[SUCCESS] Python build complete."

      - name: Upload Python Artifact
        if: matrix.language == 'python'
        uses: actions/upload-artifact@v4
        with:
          name: python-artifact
          path: dist/
          retention-days: 1

      # GO BUILD STEPS
      - name: Run Build in Go Container
        if: matrix.language == 'go'
        run: |
          echo "=== Executing Go Compilation inside Docker ==="
          echo "[INFO] Using Go 1.24 Builder Image with Artifactory Go Proxy."
          docker run --rm \
            --entrypoint "" \
            -e GOPROXY="https://${{ secrets.JFROG_USERNAME }}:${{ secrets.JFROG_PASSWORD }}@trial2zs76n.jfrog.io/artifactory/api/go/go-virtual" \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            trial2zs76n.jfrog.io/docker-local/go-builder:1.0 \
            bash -c "go mod download && mkdir -p dist && go build -o dist/app ."
          echo "[SUCCESS] Go compilation complete."

      - name: Upload Go Artifact
        if: matrix.language == 'go'
        uses: actions/upload-artifact@v4
        with:
          name: go-artifact
          path: dist/app
          retention-days: 1

      # DOTNET BUILD STEPS
      - name: Create Authenticated nuget.config
        if: matrix.language == 'dotnet'
        run: |
          echo "=== Generating Authenticated nuget.config for NuGet ==="
          mkdir -p .github/nuget
          cat << EOF > .github/nuget/nuget.config
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="Artifactory" value="https://trial2zs76n.jfrog.io/artifactory/api/nuget/v3/nuget/index.json" />
            </packageSources>
            <packageSourceCredentials>
              <Artifactory>
                <add key="Username" value="${{ secrets.JFROG_USERNAME }}" />
                <add key="ClearTextPassword" value="${{ secrets.JFROG_PASSWORD }}" />
              </Artifactory>
            </packageSourceCredentials>
          </configuration>
          EOF
          echo "[SUCCESS] nuget.config written to .github/nuget/nuget.config"

      - name: Run Build in Dotnet Container
        if: matrix.language == 'dotnet'
        run: |
          echo "=== Executing .NET Release Build inside Docker ==="
          echo "[INFO] Using .NET 8.0 SDK Builder Image."
          docker run --rm \
            --entrypoint "" \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/.github/nuget/nuget.config:/root/.nuget/NuGet/NuGet.Config \
            -w /workspace \
            trial2zs76n.jfrog.io/docker-local/dotnet-builder:1.0 \
            dotnet build -c Release -o dist
          echo "[SUCCESS] .NET build complete."

      - name: Upload Dotnet Artifact
        if: matrix.language == 'dotnet'
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-artifact
          path: dist/
          retention-days: 1

  security-sca:
    needs: [detect, build]
    if: |
      always() &&
      needs.detect.result == 'success' &&
      needs.build.result == 'success'
    strategy:
      matrix:
        language: ${{ fromJson(needs.detect.outputs.languages) }}
    uses: ./.github/workflows/sca-scan.yml
    with:
      language: ${{ matrix.language }}
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  security-sast:
    needs: [detect, build]
    if: |
      always() &&
      needs.detect.result == 'success' &&
      needs.build.result == 'success'
    uses: ./.github/workflows/sast-scan.yml
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  security-secrets:
    needs: [detect, build]
    if: |
      always() &&
      needs.detect.result == 'success' &&
      needs.build.result == 'success'
    uses: ./.github/workflows/secrets-scan.yml
    secrets:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  security-gatekeeper:
    needs: [detect, security-sca, security-sast, security-secrets]
    if: |
      always() &&
      needs.detect.result == 'success' &&
      needs.security-sca.result == 'success' &&
      needs.security-sast.result == 'success' &&
      needs.security-secrets.result == 'success'
    strategy:
      matrix:
        language: ${{ fromJson(needs.detect.outputs.languages) }}
    uses: ./.github/workflows/gatekeeper.yml
    with:
      language: ${{ matrix.language }}
      fail_on_severity: 'high'
    secrets:
      CMDB_API_KEY: ${{ secrets.CMDB_API_KEY }}

  docker-delivery:
    needs: [detect, build, security-gatekeeper]
    if: |
      always() &&
      needs.detect.result == 'success' &&
      needs.build.result == 'success' &&
      needs.security-gatekeeper.result == 'success'
    strategy:
      matrix:
        language: ${{ fromJson(needs.detect.outputs.languages) }}
    uses: ./.github/workflows/docker-delivery.yml
    with:
      language: ${{ matrix.language }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
    