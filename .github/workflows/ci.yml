name: Universal CI

on:
  push:
    branches:
      - main
      - feature/*
      - bugfix/*
      - hotfix/*
      - chore/*
      - refactor/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      language: ${{ steps.detect.outputs.language }}
      languages: ${{ steps.detect.outputs.languages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect Project Type
        id: detect
        run: bash scripts/detect.sh

  build:
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: ${{ fromJson(needs.detect.outputs.languages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Artifactory
        run: |
          echo "${{ secrets.JFROG_PASSWORD }}" | docker login trial2zs76n.jfrog.io \
            -u "${{ secrets.JFROG_USERNAME }}" \
            --password-stdin

      # JAVA BUILD STEPS
      - name: Create Authenticated Maven settings.xml
        if: matrix.language == 'java'
        run: |
          mkdir -p .github/maven
          cat << 'EOF' > .github/maven/settings.xml
          <settings>
            <servers>
              <server>
                <id>artifactory</id>
                <username>${env.JFROG_USERNAME}</username>
                <password>${env.JFROG_PASSWORD}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>artifactory-profile</id>
                <repositories>
                  <repository>
                    <id>artifactory</id>
                    <url>https://trial2zs76n.jfrog.io/artifactory/maven-central</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                  <repository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>artifactory</id>
                    <url>https://trial2zs76n.jfrog.io/artifactory/maven-central</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </pluginRepository>
                  <pluginRepository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>artifactory-profile</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Run Build in Java Container
        if: matrix.language == 'java'
        run: |
          docker run --rm \
            --entrypoint "" \
            -e JFROG_USERNAME="${{ secrets.JFROG_USERNAME }}" \
            -e JFROG_PASSWORD="${{ secrets.JFROG_PASSWORD }}" \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/.github/maven/settings.xml:/root/.m2/settings.xml \
            -w /workspace \
            trial2zs76n.jfrog.io/docker-local/java-builder:1.0 \
            mvn clean package -U -DskipTests

      - name: Upload Java Artifact
        if: matrix.language == 'java'
        uses: actions/upload-artifact@v4
        with:
          name: java-artifact
          path: target/*.jar
          retention-days: 1

      # PYTHON BUILD STEPS
      - name: Create Authenticated pip.conf
        if: matrix.language == 'python'
        run: |
          mkdir -p .github/pip
          cat << EOF > .github/pip/pip.conf
          [global]
          index-url=https://${{ secrets.JFROG_USERNAME }}:${{ secrets.JFROG_PASSWORD }}@trial2zs76n.jfrog.io/artifactory/api/pypi/pypi/simple
          EOF

      - name: Run Build in Python Container
        if: matrix.language == 'python'
        run: |
          docker run --rm \
            --entrypoint "" \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/.github/pip/pip.conf:/etc/pip.conf \
            -w /workspace \
            trial2zs76n.jfrog.io/docker-local/python-builder:1.0 \
            bash -c "if [ -f requirements.txt ]; then pip install --root-user-action=ignore -r requirements.txt; fi && python -m build"

      - name: Upload Python Artifact
        if: matrix.language == 'python'
        uses: actions/upload-artifact@v4
        with:
          name: python-artifact
          path: dist/
          retention-days: 1

      # GO BUILD STEPS
      - name: Run Build in Go Container
        if: matrix.language == 'go'
        run: |
          docker run --rm \
            --entrypoint "" \
            -e GOPROXY="https://${{ secrets.JFROG_USERNAME }}:${{ secrets.JFROG_PASSWORD }}@trial2zs76n.jfrog.io/artifactory/api/go/go-virtual" \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            trial2zs76n.jfrog.io/docker-local/go-builder:1.0 \
            bash -c "go mod download && mkdir -p dist && go build -o dist/app ."

      - name: Upload Go Artifact
        if: matrix.language == 'go'
        uses: actions/upload-artifact@v4
        with:
          name: go-artifact
          path: dist/app
          retention-days: 1

      # DOTNET BUILD STEPS
      - name: Create Authenticated nuget.config
        if: matrix.language == 'dotnet'
        run: |
          mkdir -p .github/nuget
          cat << EOF > .github/nuget/nuget.config
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="Artifactory" value="https://trial2zs76n.jfrog.io/artifactory/api/nuget/v3/nuget/index.json" />
            </packageSources>
            <packageSourceCredentials>
              <Artifactory>
                <add key="Username" value="${{ secrets.JFROG_USERNAME }}" />
                <add key="ClearTextPassword" value="${{ secrets.JFROG_PASSWORD }}" />
              </Artifactory>
            </packageSourceCredentials>
          </configuration>
          EOF

      - name: Run Build in Dotnet Container
        if: matrix.language == 'dotnet'
        run: |
          docker run --rm \
            --entrypoint "" \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/.github/nuget/nuget.config:/root/.nuget/NuGet/NuGet.Config \
            -w /workspace \
            trial2zs76n.jfrog.io/docker-local/dotnet-builder:1.0 \
            dotnet build -c Release -o dist

      - name: Upload Dotnet Artifact
        if: matrix.language == 'dotnet'
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-artifact
          path: dist/
          retention-days: 1

  security-scan:
    needs: [detect, build]
    if: |
      always() &&
      needs.detect.result == 'success' &&
      needs.build.result == 'success'
    uses: ./.github/workflows/security.yml
    with:
      fail_on_severity: 'high'
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      CMDB_API_KEY: ${{ secrets.CMDB_API_KEY }}
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  publish:
    needs: [detect, security-scan]
    if: |
      always() &&
      needs.detect.result == 'success' &&
      needs.security-scan.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/publish.yml
    with:
      language: ${{ needs.detect.outputs.language }}
    secrets: inherit

  build-image:
    needs: [detect, build, security-scan]
    if: |
      always() &&
      needs.detect.result == 'success' &&
      needs.build.result == 'success' &&
      needs.security-scan.result != 'cancelled'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: ${{ fromJson(needs.detect.outputs.languages) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.language }}-artifact
          path: ./artifacts

      - name: Login to Artifactory
        run: |
          echo "${{ secrets.JFROG_PASSWORD }}" | docker login trial2zs76n.jfrog.io \
            -u "${{ secrets.JFROG_USERNAME }}" \
            --password-stdin

      - name: Generate Dockerfile and Build Image
        run: |
          IMAGE_NAME="trial2zs76n.jfrog.io/docker-local/${{ github.event.repository.name }}-${{ matrix.language }}:${{ github.run_number }}"
          
          if [ "${{ matrix.language }}" = "java" ]; then
            mkdir -p target
            cp ./artifacts/*.jar ./target/
            cat << 'EOF' > Dockerfile
          FROM eclipse-temurin:21-jre-alpine
          WORKDIR /app
          COPY target/*.jar app.jar
          EXPOSE 8080
          ENTRYPOINT ["java", "-jar", "app.jar"]
          EOF
          elif [ "${{ matrix.language }}" = "python" ]; then
            mkdir -p dist
            cp -r ./artifacts/* ./dist/
            cat << 'EOF' > Dockerfile
          FROM python:3.12-slim
          WORKDIR /app
          COPY dist/ .
          RUN pip install --no-cache-dir ./*.whl
          EXPOSE 8080
          ENTRYPOINT ["python", "-m", "app"]
          EOF
          elif [ "${{ matrix.language }}" = "go" ]; then
            mkdir -p dist
            cp -r ./artifacts/* ./dist/
            cat << 'EOF' > Dockerfile
          FROM alpine:latest
          WORKDIR /app
          COPY dist/app .
          EXPOSE 8080
          ENTRYPOINT ["./app"]
          EOF
          elif [ "${{ matrix.language }}" = "dotnet" ]; then
            mkdir -p dist
            cp -r ./artifacts/* ./dist/
            cat << 'EOF' > Dockerfile
          FROM mcr.microsoft.com/dotnet/aspnet:8.0
          WORKDIR /app
          COPY dist/ .
          ENTRYPOINT ["dotnet", "Org.Springframework.Samples.Petclinic.dll"]
          EOF
          fi
          
          docker build -t "$IMAGE_NAME" .
          docker push "$IMAGE_NAME"
    