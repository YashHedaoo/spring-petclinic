name: Docker Delivery

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_TOKEN:
        required: true

jobs:
  docker-delivery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate Version Tags
        id: meta
        run: |
          IMAGE_NAME="yashhedaoof5/sp"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          REF_NAME="${{ github.ref_name }}"
          REF_CLEAN=$(echo "$REF_NAME" | sed 's/[^a-zA-Z0-9.-]/_/g')
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Release tag
            VERSION="${REF_NAME}"
            TAGS="${IMAGE_NAME}:${VERSION},${IMAGE_NAME}:latest"
            PRIMARY_TAG="${IMAGE_NAME}:${VERSION}"
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            # Main branch
            TAGS="${IMAGE_NAME}:latest,${IMAGE_NAME}:sha-${SHA_SHORT}"
            PRIMARY_TAG="${IMAGE_NAME}:sha-${SHA_SHORT}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Pull Request
            PR_NUM="${{ github.event.number }}"
            TAGS="${IMAGE_NAME}:pr-${PR_NUM}"
            PRIMARY_TAG="${IMAGE_NAME}:pr-${PR_NUM}"
          else
            # Other branch
            TAGS="${IMAGE_NAME}:branch-${REF_CLEAN}"
            PRIMARY_TAG="${IMAGE_NAME}:branch-${REF_CLEAN}"
          fi
          
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "primary_tag=${PRIMARY_TAG}" >> $GITHUB_OUTPUT
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: Download Built Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.language }}-artifact
          path: ./artifacts

      - name: Login to Docker Hub
        run: |
          echo "=== Authenticating with Docker Hub ==="
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          echo "[SUCCESS] Authenticated successfully with Docker Hub."

      - name: Generate Dockerfile and Build Image
        run: |
          echo "=== Initializing Docker Build for Target: ${{ inputs.language }} ==="
          PRIMARY_TAG="${{ steps.meta.outputs.primary_tag }}"
          echo "[INFO] Primary Docker image tag: ${PRIMARY_TAG}"
          
          if [ "${{ inputs.language }}" = "java" ]; then
            echo "[INFO] Copying Java build JAR into context..."
            mkdir -p target
            cp ./artifacts/*.jar ./target/
            echo "[INFO] Generating Java runtime Dockerfile..."
            cat << 'EOF' > Dockerfile
          FROM eclipse-temurin:21-jre-alpine
          WORKDIR /app
          COPY target/*.jar app.jar
          EXPOSE 8080
          ENTRYPOINT ["java", "-jar", "app.jar"]
          EOF
          elif [ "${{ inputs.language }}" = "python" ]; then
            echo "[INFO] Copying Python wheels into context..."
            mkdir -p dist
            cp -r ./artifacts/* ./dist/
            echo "[INFO] Generating Python runtime Dockerfile..."
            cat << 'EOF' > Dockerfile
          FROM python:3.12-slim
          WORKDIR /app
          COPY dist/ .
          RUN pip install --no-cache-dir ./*.whl
          EXPOSE 8080
          ENTRYPOINT ["python", "-m", "app"]
          EOF
          elif [ "${{ inputs.language }}" = "go" ]; then
            echo "[INFO] Copying Go executable binary into context..."
            mkdir -p dist
            cp -r ./artifacts/* ./dist/
            echo "[INFO] Generating Go runtime Dockerfile..."
            cat << 'EOF' > Dockerfile
          FROM alpine:latest
          WORKDIR /app
          COPY dist/app .
          EXPOSE 8080
          ENTRYPOINT ["./app"]
          EOF
          elif [ "${{ inputs.language }}" = "dotnet" ]; then
            echo "[INFO] Copying .NET release files into context..."
            mkdir -p dist
            cp -r ./artifacts/* ./dist/
            echo "[INFO] Generating .NET runtime Dockerfile..."
            cat << 'EOF' > Dockerfile
          FROM mcr.microsoft.com/dotnet/aspnet:8.0
          WORKDIR /app
          COPY dist/ .
          ENTRYPOINT ["dotnet", "Org.Springframework.Samples.Petclinic.dll"]
          EOF
          fi
          
          echo "[INFO] Appending Artifact Traceability OCI Metadata Labels..."
          cat << EOF >> Dockerfile
          LABEL org.opencontainers.image.title="Spring Petclinic (${{ inputs.language }})"
          LABEL org.opencontainers.image.source="https://github.com/${{ github.repository }}"
          LABEL org.opencontainers.image.revision="${{ github.sha }}"
          LABEL org.opencontainers.image.created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          LABEL org.opencontainers.image.version="${PRIMARY_TAG}"
          LABEL org.opencontainers.image.vendor="Spring Petclinic Enterprise"
          EOF
          
          echo "[INFO] Launching Docker build process..."
          docker build -t "${PRIMARY_TAG}" .
          echo "[SUCCESS] Image built successfully: ${PRIMARY_TAG}"

      - name: Run Trivy Vulnerability Scanner
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.primary_tag }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Tag and Push Image to Docker Hub
        run: |
          echo "=== Tagging and Pushing Image to Docker Hub ==="
          PRIMARY_TAG="${{ steps.meta.outputs.primary_tag }}"
          TAGS_CSV="${{ steps.meta.outputs.tags }}"
          
          # Convert comma-separated tags into an array
          IFS=',' read -r -a TAG_ARRAY <<< "$TAGS_CSV"
          
          for TAG in "${TAG_ARRAY[@]}"; do
            if [ "$TAG" != "$PRIMARY_TAG" ]; then
              echo "[INFO] Tagging $PRIMARY_TAG as $TAG"
              docker tag "$PRIMARY_TAG" "$TAG"
            fi
            echo "[INFO] Pushing $TAG to Docker Hub..."
            docker push "$TAG"
          done
          echo "[SUCCESS] Docker images pushed successfully."

      - name: Publish Job Summary
        if: always()
        run: |
          echo "### 🚀 Build & Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Attribute | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Language** | \`${{ inputs.language }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ steps.meta.outputs.sha_short }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Primary Docker Tag** | \`${{ steps.meta.outputs.primary_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **All Docker Tags** | \`${{ steps.meta.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trivy Scan Outcome** | ${{ steps.trivy.outcome == 'success' && '🟢 PASSED' || '🔴 FAILED/SKIPPED' }} |" >> $GITHUB_STEP_SUMMARY
