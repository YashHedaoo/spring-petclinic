name: Publish Artifact

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Download Built Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.language }}-artifact
          path: ./downloaded-artifacts

      - name: Verify Downloaded Artifacts
        run: ls -la ./downloaded-artifacts

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: https://trial2zs76n.jfrog.io
          JF_USER: ${{ secrets.JFROG_USERNAME }}
          JF_PASSWORD: ${{ secrets.JFROG_PASSWORD }}

      - name: Upload Artifacts to JFrog Artifactory
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          RUN_NUM="${{ github.run_number }}"
          if [ "${{ inputs.language }}" = "java" ]; then
            jf rt upload "downloaded-artifacts/*.jar" "java-artifacts/${REPO_NAME}/${RUN_NUM}/"
          elif [ "${{ inputs.language }}" = "python" ]; then
            jf rt upload "downloaded-artifacts/*" "python-artifacts/${REPO_NAME}/${RUN_NUM}/"
          elif [ "${{ inputs.language }}" = "go" ]; then
            jf rt upload "downloaded-artifacts/app" "go-artifacts/${REPO_NAME}/${RUN_NUM}/"
          elif [ "${{ inputs.language }}" = "dotnet" ]; then
            jf rt upload "downloaded-artifacts/*" "dotnet-artifacts/${REPO_NAME}/${RUN_NUM}/"
          else
            echo "Unsupported language: ${{ inputs.language }}"
            exit 1
          fi